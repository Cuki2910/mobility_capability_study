name: Agent gate
on:
  pull_request:
  push:
    branches: [main, development]
concurrency:
  group: agent-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_agent_gate.py tests/test_agent_ownership.py -v
      - name: Run policy gate
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          python scripts/agent_gate.py --base "$BASE" --format json | tee agent-gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-gate-report
          path: agent-gate-report.json
          if-no-files-found: ignore
